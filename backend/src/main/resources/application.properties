# ========================================
# AR Store - Application Configuration
# ========================================
# Default: H2 in-memory database (no setup needed!)
# For MySQL: set spring.profiles.active=mysql
# ========================================

# Server
server.port=8080

# Default: H2 Database (runs immediately, no install needed)
spring.datasource.url=jdbc:h2:mem:arstore
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
